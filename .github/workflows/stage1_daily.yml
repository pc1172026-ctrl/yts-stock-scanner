name: YTS Stage1 Daily Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Update trust / revenue / EPS
        run: python update_stage1_data.py
      - name: Commit Stage1 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stage1/
          if git diff --cached --quiet; then
            echo "No Stage1 changes."
          else
            git commit -m "Update YTS Stage1 data"
            git push
          fi
